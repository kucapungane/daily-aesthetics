# Builds the site and publishes it to GitHub Pages.
# The daily routine pushes its new lesson to a claude/… branch; this workflow merges that branch
# into main, then starts itself again on main (a push made with GITHUB_TOKEN starts no workflow,
# a workflow_dispatch does), and only a run on main deploys: the Pages environment admits main only.
# Each job gets only the permissions it uses, and every action is pinned to a commit.
name: Build and deploy

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  merge:
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Merge the lesson branch into main
        run: |
          # a lesson branch may only add or change lessons; anything else waits for a person
          if git diff --name-only "origin/main...origin/${GITHUB_REF_NAME}" | grep -v '^lessons/'; then
            echo "::error::This branch changes files outside lessons/; merge it by hand after review."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main
          git push origin --delete "${GITHUB_REF_NAME}" || true
      - name: Deploy from main
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: WebP copies of lesson photographs
        run: |
          pip install --disable-pip-version-check --quiet pillow==11.3.0
          python3 tools/optimize-images.py
      - name: Build
        run: node build.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
